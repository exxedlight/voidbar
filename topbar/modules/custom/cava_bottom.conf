[general]
framerate = 30

sensitivity = 150

bars = 16


[input]
method = pulse
source = auto


[output]
method = raw

orientation = bottom

channels = mono
mono_option = average
reverse = 1

raw_target = /dev/stdout

data_format = ascii

ascii_max_range = 9

bar_delimiter = 59
frame_delimiter = 10

show_idle_bar_heads = 1


[color]

[smoothing]
noise_reduction = 15


[eq]
1 = 1 # bass
2 = 1
3 = 1
4 = 0.8
5 = 0.7
6 = 0.7
7 = 0.6
8 = 0.6
9 = 0.6
10 = 0.7 
11 = 0.8
12 = 0.9 # treble